services:
  prd-engine-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: prd-engine-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?Set a SECRET_KEY of at least 32 characters}
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN:?Set an API_ACCESS_TOKEN of at least 32 characters}
      - API_PREFIX=/api/v1
      - MAX_RETRIES=3
      - RETRY_BACKOFF_BASE=2
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?Set a WEBHOOK_SECRET of at least 32 characters}
      - IDEMPOTENCY_TTL_HOURS=24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prd-engine-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs

  prd-engine-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    container_name: prd-engine-worker
    command: python -m uvicorn prd_engine.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in the deployment environment}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?Set a SECRET_KEY of at least 32 characters}
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN:?Set an API_ACCESS_TOKEN of at least 32 characters}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?Set a WEBHOOK_SECRET of at least 32 characters}
      - WORKER_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prd-engine-network

  postgres:
    image: postgres:15-alpine
    container_name: prd-engine-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-prd_engine}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-prd_engine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - prd-engine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prd_engine} -d ${POSTGRES_DB:-prd_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: prd-engine-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - prd-engine-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  prd-engine-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
